<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | Мой Не Сам</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    padding: 40px;
    width: 100%;
    max-width: 500px;
}

h1 {
    color: #2e7d32;
    margin-bottom: 10px;
    font-size: 28px;
}

p {
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-weight: 500;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    transition: all 0.3s;
}

input:focus {
    outline: none;
    border-color: #4caf50;
    box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
}

button {
    background: #4caf50;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    transition: background 0.3s;
}

button:hover {
    background: #2e7d32;
}

.error {
    background: #ffebee;
    color: #c62828;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 20px;
    border-left: 4px solid #c62828;
}

.success {
    background: #e8f5e9;
    color: #2e7d32;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 20px;
    border-left: 4px solid #2e7d32;
}

a {
    color: #4caf50;
    text-decoration: none;
    font-weight: 500;
}

a:hover {
    text-decoration: underline;
}

</style>


<body>
    <div class="container">
        <h1>Регистрация</h1>
        <p>Портал клининговых услуг «Мой Не Сам»</p>

        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="success" style="display: none;"></div>

        <form id="registerForm">
            <label>Логин:</label>
            <input type="text" id="login" required>

            <label>Пароль:</label>
            <input type="password" id="password" required>

            <label>ФИО:</label>
            <input type="text" id="full_name" required>

            <label>Телефон:</label>
            <input type="tel" id="phone" required>

            <label>Email:</label>
            <input type="email" id="email" required>

            <button type="submit">Зарегистрироваться</button>
        </form>

        <p>Уже есть аккаунт? <a href="/login">Войти</a></p>
    </div>

    <script src="/js/register.js"></script>
</body>
</html>
