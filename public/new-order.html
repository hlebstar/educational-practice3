<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Новая заявка | Мой Не Сам</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2e7d32;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4caf50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }
        
        .radio-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            cursor: pointer;
        }
        
        .radio-group input {
            width: auto;
            margin-right: 8px;
            margin-bottom: 0;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn-secondary {
            background: #757575;
        }
        
        .btn-secondary:hover {
            background: #616161;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c62828;
            display: none;
        }
        
        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #2e7d32;
            display: none;
        }
        
        .info-text {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        @media (max-width: 768px) {
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> Создание заявки</h1>
        <p>Заполните форму для оформления заказа на уборку</p>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <form id="orderForm">
            <div class="form-group">
                <label for="address"> Адрес уборки *</label>
                <input type="text" id="address" name="address" required>
            </div>
            
            <div class="form-group">
                <label for="contact"> Контактные данные *</label>
                <input type="text" id="contact" name="contact" required 
                       placeholder="Телефон или email для связи">
                <div class="info-text">Укажите номер телефона или email для связи с вами</div>
            </div>
            
            <div class="form-group">
                <label for="service_type"> Вид услуги *</label>
                <select id="service_type" name="service_type" required>
                    <option value="">Выберите услугу</option>
                    <option value="общий клининг">Общий клининг</option>
                    <option value="генеральная уборка">Генеральная уборка</option>
                    <option value="послестроительная уборка">Послестроительная уборка</option>
                    <option value="химчистка ковров и мебели">Химчистка ковров и мебели</option>
                </select>
            </div>
            
            <div class="form-group">
                <label> Тип оплаты *</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="payment_type" value="наличные" required>  Наличные
                    </label>
                    <label>
                        <input type="radio" name="payment_type" value="банковская карта" required> Банковская карта
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="desired_date"> Желаемая дата *</label>
                <input type="date" id="desired_date" name="desired_date" required>
            </div>
            
            <div class="form-group">
                <label for="desired_time"> Желаемое время *</label>
                <input type="time" id="desired_time" name="desired_time" required>
            </div>
            
            <div class="btn-group">
                <button type="submit" class="btn-primary"> Отправить заявку</button>
                <button type="button" class="btn-secondary" onclick="window.location.href='/dashboard'"> Отмена</button>
            </div>
        </form>
        
        <p style="margin-top: 20px; text-align: center;">
            <a href="/dashboard"> Вернуться в личный кабинет</a>
        </p>
    </div>
<script src="/js/new-order.js"></script>
</body>
</html>
