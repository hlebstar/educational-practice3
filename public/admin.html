<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ панель</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1> Панель администратора</h1>
                <p>Управление заявками клининговой службы «Мой Не Сам»</p>
            </div>
            <a href="/logout" class="logout-btn"> Выйти</a>
        </div>


 <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Клиент</th>
                        <th>Контакты</th>
                        <th>Адрес</th>
                        <th>Услуга</th>
                        <th>Дата</th>
                        <th>Время</th>
                        <th>Оплата</th>
                        <th>Статус</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="ordersTable">
                    <tr>
                        <td colspan="10" style="text-align: center;">Загрузка...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label"> Всего заявок</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="newCount">0</div>
                <div class="stat-label">Новые</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="workCount">0</div>
                <div class="stat-label"> В работе</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="doneCount">0</div>
                <div class="stat-label"> Выполнено</div>
            </div>
        </div>
    </div>

    <div id="cancelModal" class="modal">
        <div class="modal-content">
            <h3> Отмена заявки</h3>
            <p>Укажите причину отмены:</p>
            <textarea id="cancelReason" rows="3" placeholder="Например: клиент передумал, нет доступа в квартиру..."></textarea>
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeModal()">Отмена</button>
                <button class="confirm-btn" id="confirmCancelBtn">Подтвердить</button>
            </div>
        </div>
    </div>

    </div>

  <script src="/js/admin.js"></script>
</body>
</html>
